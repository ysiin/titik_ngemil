<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Titik Ngemil</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍢</text></svg>">
</head>
<body class="admin-body" data-page="admin">

<!-- LOGIN GATE -->
<div id="loginGate" class="login-gate">
  <div class="admin-card">
    <div class="brand" style="margin-bottom:16px"><span class="brand-logo">⚙️</span><span>Titik Ngemil<small>Admin Panel</small></span></div>
    <h3 style="margin-bottom:.3em">Masuk Dashboard</h3>
    <p class="muted" style="font-size:.9rem">Mode demo: masukkan kata sandi apa saja (mis. <code>admin</code>) untuk mencoba pengelolaan data secara lokal.</p>
    <label>Kata Sandi</label>
    <input type="password" id="gatePass" placeholder="admin" autocomplete="current-password">
    <button class="btn btn-primary btn-block" style="margin-top:14px" id="gateBtn">Masuk Dashboard</button>
    <p class="form-note">Untuk mode terhubung API/D1, atur token di tab <b>Pengaturan</b> setelah masuk.</p>
  </div>
</div>

<!-- APP -->
<div id="adminApp" class="hidden">
  <div class="admin-bar">
    <div class="wrap">
      <span style="font-weight:800">🍢 Titik Ngemil <span style="opacity:.6;font-weight:600">Admin</span></span>
      <div class="admin-tabs" id="tabs">
        <button data-tab="dashboard" class="on">Dashboard</button>
        <button data-tab="tenants">Tenant</button>
        <button data-tab="stalls">Zona & Lapak</button>
        <button data-tab="schedule">Jadwal</button>
        <button data-tab="applications">Pendaftaran</button>
        <button data-tab="export">Export / Deploy</button>
        <button data-tab="settings">Pengaturan</button>
      </div>
      <div class="flex" style="margin-left:auto">
        <span id="modeBadge" class="badge-soft" style="background:#322d28;color:#ffd166">Mode Lokal</span>
        <a class="btn btn-ghost btn-sm" href="../index.html" target="_blank" rel="noopener">Lihat Situs ↗</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" style="color:#fff;border-color:#4a423b">Keluar</button>
      </div>
    </div>
  </div>

  <main class="admin-main">
    <div class="wrap">
      <div id="tab-dashboard" class="tab-pane"></div>
      <div id="tab-tenants" class="tab-pane hidden"></div>
      <div id="tab-stalls" class="tab-pane hidden"></div>
      <div id="tab-schedule" class="tab-pane hidden"></div>
      <div id="tab-applications" class="tab-pane hidden"></div>
      <div id="tab-export" class="tab-pane hidden"></div>
      <div id="tab-settings" class="tab-pane hidden"></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-back" id="modalBack">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="../data/db.js"></script>
<script src="admin.js"></script>
</body>
</html>
