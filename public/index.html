<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titik Ngemil — Pop-up Market PKL Terkurasi di Gondangdia</title>
  <meta name="description" content="Titik Ngemil #1 — pop-up market pedagang kaki lima terkurasi di kawasan Stasiun Gondangdia. Jumat, 30 Oktober 2026.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍢</text></svg>">
</head>
<body data-page="home">
  <header id="site-header"></header>

  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="eyebrow" data-i18n="hero_eyebrow"></span>
        <h1 data-i18n="hero_title" data-i18n-html="1"></h1>
        <p class="muted" data-i18n="hero_sub" style="font-size:1.08rem;max-width:56ch"></p>
        <div class="hero-meta" id="hero-meta"></div>
        <div class="hero-cta">
          <a class="btn btn-primary" href="tenant.html" data-i18n="cta_explore"></a>
          <a class="btn btn-ghost" href="kunjungan.html" data-i18n="cta_visit"></a>
        </div>
      </div>
      <div class="hero-card">
        <div class="stat-row" id="home-stats"></div>
        <ul>
          <li>✅ <span data-i18n="curated"></span> — tenant lolos seleksi tim kurasi</li>
          <li>✅ <span data-i18n="free_entry"></span> — tanpa tiket, untuk semua</li>
          <li>✅ Satu lokasi, lima zona tematik</li>
        </ul>
      </div>
    </div>
  </section>

  <!-- ZONES -->
  <section class="bg-alt">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="zones_title"></h2>
          <p data-i18n="zones_sub"></p>
        </div>
        <a class="btn btn-ghost" href="peta.html" data-i18n="nav_map"></a>
      </div>
      <div class="grid grid-3" id="zones-grid"></div>
    </div>
  </section>

  <!-- FEATURED -->
  <section>
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="featured"></h2>
          <p data-i18n="featured_sub"></p>
        </div>
        <a class="btn btn-ghost" href="tenant.html" data-i18n="view_all"></a>
      </div>
      <div class="grid grid-3" id="featured-grid"></div>
    </div>
  </section>

  <!-- SCHEDULE PREVIEW -->
  <section class="bg-ink">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="schedule_title"></h2>
          <p data-i18n="schedule_sub"></p>
        </div>
        <a class="btn btn-primary" href="jadwal.html" data-i18n="nav_schedule"></a>
      </div>
      <div class="timeline" id="home-schedule"></div>
    </div>
  </section>

  <!-- PARTNER CTA -->
  <section>
    <div class="wrap">
      <div class="panel" style="display:flex;gap:26px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,var(--brand-soft),#e6fbf3)">
        <div style="max-width:62ch">
          <h2 data-i18n="partner_title" style="margin-bottom:.2em"></h2>
          <p class="muted mb0" data-i18n="partner_sub"></p>
        </div>
        <div class="flex">
          <a class="btn btn-primary" href="partner.html" data-i18n="partner_cta"></a>
          <a class="btn btn-dark" href="gabung.html" data-i18n="join_title"></a>
        </div>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>
  <script src="data/db.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
