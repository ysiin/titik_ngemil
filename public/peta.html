<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Lapak — Titik Ngemil</title>
  <meta name="description" content="Peta interaktif lapak Titik Ngemil. Klik lapak untuk melihat tenant dan menunya.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍢</text></svg>">
</head>
<body data-page="map">
  <header id="site-header"></header>

  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">🗺️ Stall Map</span>
      <h1 data-i18n="map_title"></h1>
      <p class="muted" style="max-width:62ch" data-i18n="map_sub"></p>
    </div>
  </section>

  <section style="padding-top:20px">
    <div class="wrap">
      <div class="map-layout">
        <div class="map-shell"><div id="map-svg"></div></div>
        <div class="map-side">
          <div class="panel" id="stall-info">
            <p class="muted mb0">👆 Klik salah satu lapak pada denah untuk melihat tenant-nya.</p>
          </div>
          <div class="panel">
            <h3 data-i18n="zones_title"></h3>
            <div class="legend" id="map-legend"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="bg-alt">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="stall_table"></h2>
          <p data-i18n="stall_table_sub"></p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="th_tenant"></th>
              <th data-i18n="th_cat"></th>
              <th data-i18n="th_zone"></th>
              <th data-i18n="th_stall"></th>
              <th data-i18n="th_action"></th>
            </tr>
          </thead>
          <tbody id="stall-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>
  <script src="data/db.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
