<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pindah ke Denah Booth — Titik Ngemil</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍢</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/data/db.js"></script>
  <script>
    // Halaman lama "peta.html" dipindahkan ke "/titik/gondangdia/denah".
    // Teruskan parameter ?stall=KODE sebagai ?booth=N bila memungkinkan.
    (function () {
      var params = new URLSearchParams(location.search);
      var stall = params.get("stall");
      var target = "/titik/gondangdia/denah";
      try {
        if (stall && window.TITIK_DB) {
          var s = (window.TITIK_DB.stalls || []).find(function (x) { return x.code === stall; });
          if (s && s.no) target += "?booth=" + s.no;
        }
        var booth = params.get("booth");
        if (booth) target += "?booth=" + encodeURIComponent(booth);
      } catch (e) {}
      location.replace(target);
    })();
  </script>
</head>
<body data-page="map">
  <section class="page-hero" style="text-align:center">
    <div class="wrap">
      <div style="font-size:3rem">🗺️</div>
      <h1>Memindahkan ke Denah Booth…</h1>
      <p class="muted">Halaman peta lapak kini ada di <a href="/titik/gondangdia/denah" style="color:var(--brand-dark);font-weight:700">/titik/gondangdia/denah</a>.</p>
      <a class="btn btn-primary" href="/titik/gondangdia/denah">Buka Denah Booth</a>
    </div>
  </section>
</body>
</html>
