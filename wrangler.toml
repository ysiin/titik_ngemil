# =====================================================================
#  Titik Ngemil — Cloudflare Worker (static assets + API)
# =====================================================================
#  Struktur:
#    worker/index.js   -> menangani /api/*
#    public/           -> seluruh HTML/CSS/JS (static assets)
#
#  Deploy: `npx wrangler deploy`  (default Workers Builds, tanpa ubah apa pun)

name = "titik-ngemil"
main = "worker/index.js"
compatibility_date = "2026-10-27"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Worker dijalankan lebih dulu supaya /api/* (termasuk kalau dibuka
# lewat browser) tetap dilayani API, bukan halaman 404.
run_worker_first = true

# ---------------------------------------------------------------------
#  Database D1
# ---------------------------------------------------------------------
#  Binding D1 SENGAJA dikomentari supaya deploy pertama tidak gagal.
#  Aktifkan setelah database-nya dibuat:
#
#  OPSI A (dashboard, disarankan):
#    Worker project -> Settings -> Bindings -> Add -> D1 database
#      Variable name: DB   -> pilih database: titik-ngemil-db
#    lalu Deployments -> Retry deployment.
#
#  OPSI B (lewat file ini):
#    buka komentar blok di bawah dan isi database_id dari
#    `npx wrangler d1 create titik-ngemil-db`.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "titik-ngemil-db"
# database_id = "GANTI_DENGAN_DATABASE_ID_ANDA"
#
# [vars]
# ADMIN_TOKEN = "ganti-dengan-token-rahasia-anda"
# ---------------------------------------------------------------------